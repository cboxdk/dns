name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sockets, openssl, sodium, intl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint (Pint)
        run: composer lint

      - name: Static analysis (PHPStan)
        run: composer analyse

      - name: Tests (Pest)
        run: composer test

      - name: License gate
        run: composer license-check

      - name: SBOM drift gate
        run: |
          composer sbom
          git diff --exit-code sbom.json

      - name: Dependency audit
        # Full tree (incl. dev): with zero runtime dependencies a --no-dev audit has
        # an empty package set and errors, and the dev tree is the only thing to vet.
        run: composer audit
